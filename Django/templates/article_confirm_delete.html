{% extends "layout.html" %}

{% block body %}

<h2>Məqaləni Silin</h2>

<div style="background-color: #f8d7da; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #f5c6cb; color: #721c24;">
    <p><strong>Diqqət!</strong> Bu məqaləni silmə əməliyyatı geri alına bilməz.</p>
    <p><strong>Məqalə:</strong> {{ article.title }}</p>
</div>

<form method="POST" style="margin-top: 20px;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Bəli, Silin</button>
    <a href="{% url 'article-detail' article.id %}" class="btn btn-secondary">Ləğv Et</a>
</form>

{% endblock body %}
